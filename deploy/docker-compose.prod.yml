# Production stack on the VPS. Copied to $DEPLOY_PATH by the deploy workflow.
# Secrets (DB_PASSWORD, JWT_SECRET, ...) live in $DEPLOY_PATH/.env on the VPS only.
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: verysmartbus-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
