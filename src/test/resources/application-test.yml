# Test profile — uses H2 in-memory DB (no real Postgres needed for unit tests)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false   # disable Flyway in tests — Hibernate creates schema instead

# Test-only signing key (base64, >= 32 bytes) so tests don't depend on a JWT_SECRET env var
jwt:
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLXZlcnlzbWFydGJ1cy10ZXN0cw==
