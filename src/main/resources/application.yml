spring:
  application:
    name: VerySmartBus

  # ─── DataSource (Supabase / PostgreSQL) ───────────────────
  datasource:
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres
    username: postgres.dunhgmpegsmvwdakrvkw
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      keepalive-time: 30000
      max-lifetime: 1800000

  # ─── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ─── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# ─── Server ────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ─── JWT ──────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# ─── Live location ───────────────────────────────────────
app:
  live-location:
    stale-after-seconds: 120
  notifications:
    outbox:
      enabled: ${NOTIFICATION_OUTBOX_ENABLED:true}
      poll-delay-ms: ${NOTIFICATION_OUTBOX_POLL_DELAY_MS:5000}
      batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:100}
      retry-delay-seconds: ${NOTIFICATION_OUTBOX_RETRY_DELAY_SECONDS:10}
      processing-timeout-seconds: ${NOTIFICATION_OUTBOX_PROCESSING_TIMEOUT_SECONDS:60}
  # Comma-separated browser origins allowed to call the API and open the WebSocket.
  # Patterns are allowed, e.g. "https://app.example.com,http://localhost:*" or "*" for any origin.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

# ─── Actuator ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Swagger / OpenAPI ───────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ─── Logging ──────────────────────────────────────────────
logging:
  level:
    com.verysmartbus: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
