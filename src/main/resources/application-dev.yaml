spring:
  # ─── DataSource (PostgreSQL) ───────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_bus_db
    username: postgres
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      keepalive-time: 30000
      max-lifetime: 1800000
